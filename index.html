<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mission Control</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


<div class="mission-container">


    <h1>
        🚀 MISSION CONTROL
    </h1>


    <p>
        Build your secret futuristic mission briefing.
    </p>



    <section class="mission-panel">


        <div class="mission-option">

            <button>
                Agent Type
            </button>

            <span>
                Not Selected
            </span>

        </div>



        <div class="mission-option">

            <button>
                Mission Location
            </button>

            <span>
                Not Selected
            </span>

        </div>



        <div class="mission-option">

            <button>
                Weapon Loadout
            </button>

            <span>
                Not Selected
            </span>

        </div>



        <div class="mission-option">

            <button>
                Mission Objective
            </button>

            <span>
                Not Selected
            </span>

        </div>



        <div class="mission-option">

            <button>
                Risk Level
            </button>

            <span>
                Not Selected
            </span>

        </div>



    </section>





    <button class="launch-button">

        🚀 LAUNCH MISSION

    </button>



    <button class="random-button">

        🎲 RANDOM MISSION

    </button>



    <button class="reset-button">

        🔄 RESET SYSTEM

    </button>



    <!-- New Step 10 Audio Feature -->

    <button class="audio-button">

        🔊 PLAY BRIEFING AUDIO

    </button>






    <div class="briefing-box">


        <h2>
            Mission Briefing
        </h2>


        <div class="mission-details">

            <p>
                Mission ID:
                <span id="missionID">
                    Not Generated
                </span>
            </p>


            <p>
                Status:
                <span id="missionStatus">
                    Awaiting Launch
                </span>
            </p>


        </div>



        <p id="briefingMessage">

            Awaiting mission data...

        </p>



    </div>




</div>



<script src="script.js"></script>


</body>


</html>
